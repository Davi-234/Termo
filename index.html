<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background-color: #6e5c62;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #tebuleiro {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 10px;
        }

        .palavra {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            font-size: 1em;
            gap: 5px;
            height: auto;
            width: auto;
        }

        .leter {
            aspect-ratio: 1;
            font-weight: 600;
            font-family: 'Mitr', sans-serif;
            color: #FAFAFF;
            background-color: #615458;
            border: 0.225em solid #615458;
            border-radius: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: larger;
            line-height: 1em;
            text-transform: uppercase;

            width: 60px;
            height: 60px;
            pointer-events: none;
        }

        .editavel {
            background-color: transparent;
            border-color: #4C4347;
            cursor: pointer;
            pointer-events: auto;
        }

        .selecionado {
            border-bottom-width: 0.465em;
            border-bottom-style: solid;
            border-bottom-color: rgb(76, 67, 71);
        }

        .acerto {
            background-color: greenyellow;
            cursor: none;
            pointer-events: none;
        }

        .lugar_errado {
            background-color: yellow;
            cursor: none;
            pointer-events: none;
        }
    </style>
</head>

<script defer>
    let index_campo_palavras = 0;
    let palavra = Array.from(document.getElementsByClassName('palavra')[index_campo_palavras].children);
    let promise_value;
    window.onload = async () => {
        promise_value = await carregarPalavras();
    };
    const palavra_sort_instancia = promise_value;

    function adicionar_letra(tecla) {
        // Percorre a'palavra', que um vetor de letras
        for (let i = 0; i < palavra.length; i++) {
            // Analisa se o setor atual é o que foi selecionada pelo usuário
            if (palavra[i].classList.contains('selecionado')) {
                // Adiciona a letra no setor selecionado
                palavra[i].innerHTML = tecla;
                // Se a posição atual for anterior a última posição do vetor
                if (i < (palavra.length - 1)) {
                    // Remove o selecionamento do setor no qual fora adicionada uma letra
                    palavra[i].classList.remove('selecionado');
                    // Seleciona o setor sequinte ao atual
                    palavra[i + 1].classList.add('selecionado');
                }
                break; // encerra o laço quando o setor selecionado tem a letra adicionado em seu innerHTML
            }
        }
    }

    function backspace() {
        for (let i = 0; i < palavra.length; i++) {
            // Analisa se o setor atual é o que foi selecionada pelo usuário
            if (palavra[i].classList.contains('selecionado')) {
                // Retira a letra no setor selecionado
                palavra[i].innerHTML = "";
                // Se a posição anterior a atual for válida para vetores 
                if (i - 1 > -1) {
                    // Remove o selecionamento do setor no qual fora retirada uma letra
                    palavra[i].classList.remove('selecionado');
                    // Seleciona o setor anterior ao atual
                    palavra[i - 1].classList.add('selecionado');
                }
                break; // encerra o laço quando o setor selecionado tem a letra retirada de seu innerHTML
            }
        }
    }

    function space() {
        for (let i = 0; i < palavra.length; i++) {
            // Analisa se o setor atual é o que foi selecionada pelo usuário
            if (palavra[i].classList.contains('selecionado')) {
                // Se a posição atual for anterior a última posição do vetor
                if (i < (palavra.length - 1)) {
                    palavra[i].classList.remove('selecionado');
                    palavra[i + 1].classList.add('selecionado');
                    /* O setor atualmente selecionado deixa de estar selecionado, e o seguinte é selecionado. */
                }
                break;
            }
        }
    }

    function avaliar_palavra() {
        let palavra_sort = palavra_sort_instancia;

        for (let i = 0; i < palavra.length; i++) {
            if (palavra[i].innerHTML === '' || palavra[i].innerHTML === null) {
                return;
            }
        }

        for (let i = 0; i < palavra.length; i++) {
            if (palavra[i].innerHTML === palavra_sort[i]) {
                palavra[i].classList.add('acerto');
                palavra_sort =
                    palavra_sort.slice(0, i) +
                    "*" +
                    palavra_sort.slice(i + 1);
            }
        }

        for (let i = 0; i < palavra.length; i++) {
            palavra[i].classList.remove('editavel');

            if (palavra[i].classList.contains('selecionado')) {
                palavra[i].classList.remove('selecionado')
            }

            for (let a = 0; a < palavra_sort.length; a++) {
                if (a === i || palavra_sort[a] === "*") {
                    continue;
                }

                if (palavra[i].innerHTML === palavra_sort[a]) {
                    palavra[i].classList.add('lugar_errado');
                    palavra_sort =
                        palavra_sort.slice(0, a) +
                        "*" +
                        palavra_sort.slice(a + 1);
                    break;
                }
            }
        }

        if (!ganhar(palavra)) proximo_campo_palavra();
    }

    function proximo_campo_palavra() {
        if (index_campo_palavras >= 5) {
            console.log('Perdeu');
            return;
        }
        index_campo_palavras++;
        palavra = Array.from(document.getElementsByClassName('palavra')[index_campo_palavras].children);

        for (let i = 0; i < palavra.length; i++) {
            palavra[i].classList.add('editavel');
            if (i === 0) palavra[i].classList.add('selecionado');
        }
    }

    function mostrar_tecla_incorreta(tecla) {

    }

    function ganhar(palavra) {
        let count = 0;

        for (let i = 0; i < palavra.length; i++) {
            if (palavra[i].classList.contains('acerto')) {
                count++;
            }
        }

        if (count === 5) {
            console.log('Ganhou')
        }

        return false;
    }
</script>
<script>
    window.addEventListener('keydown', function (event) {
        const tecla = event.key.toLowerCase();

        if (tecla >= 'a' && tecla <= 'z' && tecla.length === 1) {
            adicionar_letra(tecla);
        }

        // Switch focado nas teclas especiais e comandos
        switch (event.key) {
            case 'Enter':
                avaliar_palavra();
                break;
            case ' ': // Espaço vem como um caractere vazio na string
                space();
                break;
            case 'Backspace':
                backspace();
                break;
            default:
                mostrar_tecla_incorreta();
                break;
        }
    });
</script>

</html>
